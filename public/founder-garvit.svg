<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="founder-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f22"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#founder-bg)"/>
  <circle cx="300" cy="300" r="240" fill="#2a2a30" opacity="0.4"/>
  
  <!-- Silhouette / Monogram portrait -->
  <g transform="translate(300, 260)">
    <!-- Head silhouette -->
    <ellipse cx="0" cy="-30" rx="65" ry="85" fill="#3a3a42"/>
    <!-- Modern hairstyle -->
    <path d="M -68 -50 Q -70 -125 0 -130 Q 70 -125 68 -50 Q 50 -100 0 -105 Q -50 -100 -68 -50 Z" fill="#141416"/>
    <!-- Shoulders & Oversized HAVEN tee -->
    <path d="M -160 170 L -120 70 Q 0 85 120 70 L 160 170 Z" fill="#18181a"/>
    <!-- Collar line -->
    <path d="M -45 75 Q 0 95 45 75" fill="none" stroke="#2c2c32" stroke-width="4"/>
    <!-- HAVEN Chest mark -->
    <text x="50" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="3" fill="#666" font-weight="700">HAVEN</text>
  </g>

  <!-- Editorial Monogram Overlay -->
  <text x="50" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="5" fill="#888">FOUNDER &amp; CREATIVE DIRECTOR</text>
  <text x="50" y="560" font-family="'Playfair Display', serif" font-size="28" font-style="italic" fill="#ffffff">Garvit Sharma</text>
  <text x="550" y="560" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="3" fill="#666">EST. 2026</text>
</svg>
